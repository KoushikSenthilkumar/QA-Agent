[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Autonomous Multimodal QA & Bug Reproduction Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QA Agent Project" }]
keywords = ["qa", "testing", "automation", "playwright", "ai", "vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright==1.47.0",
    "openai==1.47.0",
    "Pillow==10.4.0",
    "Jinja2==3.1.4",
    "PyYAML==6.0.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "rich==13.8.1",
    "aiohttp==3.10.5",
    "aiofiles==24.1.0",
    "python-dotenv==1.0.1",
    "click==8.1.7",
    "imageio==2.35.1",
    "numpy==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.7",
    "mypy==1.11.2",
    "types-PyYAML==6.0.12.20240917",
    "types-aiofiles==24.1.0.20240626",
]

[project.scripts]
qa-agent = "qa_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qa_agent" = ["prompts/*.txt", "reporting/templates/*.html", "reporting/templates/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
